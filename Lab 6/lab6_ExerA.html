<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header section with title and short instruction -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
    </header>

    <main>
        <!-- Player input and welcome message section -->
        <section class="card">
            <label for="playerName">Your name:</label>
            <input type="text" id="playerName" placeholder="Enter your name">
            <button onclick="startGame()">Start Game</button>
            <p id="welcomeMsg"></p>
        </section>

        <!-- Game controls and choice display images -->
        <section class="card">
            <div class="controls">
                <button onclick="playRound('rock')">Rock</button>
                <button onclick="playRound('paper')">Paper</button>
                <button onclick="playRound('scissors')">Scissors</button>
            </div>

            <div class="arena">
                <div class="choice-box">
                    <p>You</p>
                    <img id="playerImg" src="rock.jpg" alt="Player Choice">
                </div>
                <div class="vs">VS</div>
                <div class="choice-box">
                    <p>Computer</p>
                    <img id="computerImg" src="rock.jpg" alt="Computer Choice">
                </div>
            </div>
        </section>

        <!-- Round result announcement and scoreboard -->
        <section class="card">
            <p id="result"></p>
            <div class="scoreboard">
                <span>Wins: <span id="wins">0</span></span>
                <span>Losses: <span id="losses">0</span></span>
                <span>Draws: <span id="draws">0</span></span>
            </div>
        </section>

        <!-- Round history table and summary controls -->
        <section class="card">
            <h3>History</h3>
            <table id="history">
                <thead>
                    <tr>
                        <th>Round</th>
                        <th>You</th>
                        <th>Computer</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                </tbody>
            </table>

            <div class="action-buttons">
                <button onclick="showSummary()">Show Summary</button>
                <button onclick="resetGame()">Reset</button>
            </div>
            <p id="summary"></p>
        </section>
    </main>

    <!-- Footer with start time and copyright -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

    <!-- Link external JavaScript file -->
    <script src="game.js"></script>
</body>
</html>
