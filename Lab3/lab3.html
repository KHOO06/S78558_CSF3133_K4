<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 3 Exercise - Interactive Contact Form</title>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <h1>Contact Us</h1>
        <span>Welcome to our feedback portal &excl;</span>
    </div>

    <hr>

    <!-- Content Section -->
    <div id="content">
        
        <div id="contact-form">
            <h2>Contact Form</h2>
            <form action="">
                <!-- Email Input -->
                <label for="useremail">Email Address:</label><br>
                <input type="email" id="useremail" name="useremail" placeholder="Enter your email" required>
                <br><br>

                <!-- Date Input -->
                <label for="contactdate">Preferred Contact Date:</label><br>
                <input type="date" id="contactdate" name="contactdate">
                <br><br>

                <!-- Range Input -->
                <label for="satisfaction">Satisfaction Level (0 to 10):</label><br>
                <input type="range" id="satisfaction" name="satisfaction" min="0" max="10" value="5">
                <br><br>

                <!-- Submit Button -->
                <input type="submit" value="Submit">
            </form>
        </div>

        <br><hr><br>

        <div id="calculator">
            <h2>Inline Calculator (Sum of Two Numbers)</h2>
            <form oninput="result.value = parseInt(num1.value || 0) + parseInt(num2.value || 0)">
                <label for="num1">First Number:</label>
                <input type="number" id="num1" value="0">
                
                &plus;

                <label for="num2">Second Number:</label>
                <input type="number" id="num2" value="0">

                &equals;

                <strong>Result:</strong>
                <output name="result" for="num1 num2">0</output>
            </form>
        </div>

    </div>

    <hr>

    <!-- Footer Section -->
    <div id="footer">
        <p>Contact us via email &colon; support &lt;at&gt; mywebsite.com</p>
        <p>Copyright &copy; 2026 My Website. All Rights Reserved.</p>
    </div>

</body>
</html>
